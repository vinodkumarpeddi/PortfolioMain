<svg
      width="100"
      height="100"
      viewBox="0 0 100 100"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      {/* Background Gradient */}
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor="#ff9a3c" />
          <stop offset="100%" stopColor="#7b39f7" />
        </linearGradient>
      </defs>

      {/* V-Shape with Glow */}
      <path
        d="M30 20 L50 80 L70 20"
        stroke="url(#grad1)"
        strokeWidth="10"
        strokeLinecap="round"
      />

      {/* Lightning Bolt */}
      <polygon
        points="45,35 55,35 50,50 60,50 45,70 50,55 40,55"
        fill="#ffcc00"
      />

      {/* Circular Elements */}
      <circle cx="50" cy="80" r="5" fill="#00aaff" />
      <circle cx="40" cy="30" r="3" fill="white" />
      <circle cx="60" cy="30" r="3" fill="white" />
    </svg>